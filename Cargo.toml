[package]
name = "shuvscan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, agentless Linux threat hunting and posture assessment"
license = "MIT"
keywords = ["linux", "security", "scanner", "incident-response", "ssh"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
jsonschema = { version = "0.56", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
